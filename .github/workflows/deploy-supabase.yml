name: deploy-supabase

# Manual. Order = secrets -> functions -> migrations (cron last by timestamp). Vault secrets are NOT set here (see docs/deployment-guide.md).
on:
  workflow_dispatch:
    inputs:
      set_secrets:
        description: Run `supabase secrets set` (needs the Edge secrets below)
        type: boolean
        default: false
      deploy_functions:
        type: boolean
        default: true
      push_migrations:
        type: boolean
        default: true

concurrency: deploy-supabase

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Skipping deploy, missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with: { version: latest }
      - name: Link project
        if: steps.gate.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Set Edge secrets
        if: steps.gate.outputs.ready == 'true' && inputs.set_secrets
        env:
          ACCESSTRADE_TOKEN: ${{ secrets.ACCESSTRADE_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
        run: |
          for v in ACCESSTRADE_TOKEN CRON_SECRET FCM_SERVICE_ACCOUNT_JSON FCM_PROJECT_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v is empty"; exit 1; }
          done
          # values via env file, never on the command line
          umask 077
          {
            echo "ACCESSTRADE_BASE_URL=https://api.accesstrade.vn"
            echo "ACCESSTRADE_TOKEN=$ACCESSTRADE_TOKEN"
            echo "CRON_SECRET=$CRON_SECRET"
            echo "FCM_PROJECT_ID=$FCM_PROJECT_ID"
            echo "FCM_SERVICE_ACCOUNT_JSON=$(printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | tr -d '\n')"
          } > "$RUNNER_TEMP/edge.env"
          supabase secrets set --env-file "$RUNNER_TEMP/edge.env"
          rm -f "$RUNNER_TEMP/edge.env"
      - name: Deploy Edge Functions
        if: steps.gate.outputs.ready == 'true' && inputs.deploy_functions
        run: supabase functions deploy
      - name: Push migrations (no seed)
        if: steps.gate.outputs.ready == 'true' && inputs.push_migrations
        run: supabase db push
