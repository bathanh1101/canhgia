          sleep 2
      - name: Start functions serve
        run: |
          cd /tmp/claude-1000/wd
          supabase functions serve --no-verify-jwt --env-file .env > /tmp/functions.log 2>&1 &
          sleep 3
      - name: Build web (for landing URL)
        run: |
          cat > apps/web/.env.local << 'EOF'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
          EOF
          pnpm --filter ./apps/web build
      - name: Build extension
        env:
          WXT_SUPABASE_URL: http://127.0.0.1:55321
          WXT_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          WXT_LANDING_URL: http://127.0.0.1:3000
        run: pnpm --filter ./apps/extension build
      - name: Install Playwright browsers
        run: pnpm --filter ./apps/extension exec playwright install --with-deps chromium
      - name: Run Playwright E2E
        env:
          WEB_BASE_URL: http://127.0.0.1:3000
          MAILPIT_URL: http://127.0.0.1:55324
        run: |
          xvfb-run -a pnpm --filter ./apps/extension exec playwright test
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-results
          path: apps/extension/playwright-report/
      - name: Cleanup
        if: always()
        run: |
          pkill -f "supabase" || true
          pkill -f "deno" || true

  mobile-e2e:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Run analyze
        run: cd apps/mobile && flutter analyze
      - name: Run tests
        run: cd apps/mobile && flutter test
        continue-on-error: true
