      - name: Create .env for functions
        run: |
          cat > /tmp/claude-1000/wd/.env << 'EOF'
          ACCESSTRADE_TOKEN=test-token
          ACCESSTRADE_BASE_URL=http://172.17.0.1:8787
          CRON_SECRET=test-cron-secret
          EOF
      - name: Start Supabase
        run: |
          cd /tmp/claude-1000/wd
          supabase start -x studio,imgproxy > /tmp/supabase.log 2>&1 &
          for i in {1..30}; do
            curl -s http://127.0.0.1:55321/rest/v1/ && echo "API ready" && break
            sleep 1
          done
      - name: Reset DB and seed
        run: |
          cd /tmp/claude-1000/wd
